    <!-- Every hard reload restarts the experience: logo reveal, then the home
         page from its first block (brief requirement). Deep links opened from
         outside still land on their page; only an in-tab reload is reset. -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
          var isReload = nav ? nav.type === 'reload' : performance.navigation && performance.navigation.type === 1;
          if (isReload && location.pathname !== '/') history.replaceState(null, '', '/');
          window.scrollTo(0, 0);
        } catch (error) {}
        document.documentElement.setAttribute('data-loading', 'true');
      })();
    </script>
    <style>
      #oph-preloader {
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center;
        background: #1b2e28; color: #f4f2ed;
        clip-path: inset(0 0 0 0);
        transition: clip-path 1.1s cubic-bezier(0.76, 0, 0.24, 1), visibility 0s linear 1.1s;
      }
      #oph-preloader.is-leaving { clip-path: inset(0 0 100% 0); visibility: hidden; }
      #oph-preloader .pl-stage { display: grid; justify-items: center; gap: 28px; transition: transform 1.1s cubic-bezier(0.76, 0, 0.24, 1), opacity .8s ease; }
      #oph-preloader.is-leaving .pl-stage { transform: translateY(-18vh) scale(.92); opacity: 0; }
      #oph-preloader .pl-mark { width: clamp(92px, 16vw, 132px); height: auto; overflow: visible; animation: pl-spin 2.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
      #oph-preloader .pl-blade { fill: #f4f2ed; transform-origin: 0 0; opacity: 0; transform: rotate(-40deg) scale(.2);
        animation: pl-blade .9s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: calc(var(--i) * 55ms + 120ms); }
      #oph-preloader .pl-ring { fill: none; stroke: #c9b08a; stroke-width: .6; stroke-dasharray: 340; stroke-dashoffset: 340; opacity: .8;
        animation: pl-ring 1.6s cubic-bezier(0.65, 0, 0.35, 1) .5s both; }
      #oph-preloader .pl-word { display: grid; justify-items: center; gap: 6px; font-family: 'Source Serif 4', Georgia, serif; text-align: center; }
      #oph-preloader .pl-line { display: block; overflow: hidden; line-height: 1.15; }
      #oph-preloader .pl-line > span { display: inline-block; transform: translateY(110%); animation: pl-rise 1s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #oph-preloader .pl-line--1 > span { font-size: clamp(13px, 1.6vw, 15px); letter-spacing: .32em; text-transform: uppercase; color: #c9b08a; font-family: Manrope, system-ui, sans-serif; font-weight: 600; animation-delay: 1.05s; }
      #oph-preloader .pl-line--2 > span { font-size: clamp(28px, 4.4vw, 46px); letter-spacing: -.01em; animation-delay: 1.2s; }
      #oph-preloader .pl-progress { width: min(220px, 50vw); height: 1px; background: rgba(244, 242, 237, .14); overflow: hidden; }
      #oph-preloader .pl-progress > i { display: block; height: 100%; background: #c9b08a; transform-origin: 0 50%; transform: scaleX(0); animation: pl-bar 2s cubic-bezier(0.65, 0, 0.35, 1) .2s both; }
      @keyframes pl-blade { to { opacity: 1; transform: rotate(0) scale(1); } }
      @keyframes pl-spin { from { transform: rotate(-120deg) scale(.85); } to { transform: rotate(0) scale(1); } }
      @keyframes pl-ring { to { stroke-dashoffset: 0; } }
      @keyframes pl-rise { to { transform: translateY(0); } }
      @keyframes pl-bar { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #oph-preloader *, #oph-preloader { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 200ms !important; }
      }
    </style>

    <!-- Accessibility + language preferences restored before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var raw = localStorage.getItem('ophtra.a11y');
          if (raw) {
            var prefs = JSON.parse(raw);
            if (prefs.contrast === 'high') root.setAttribute('data-contrast', 'high');
            if (prefs.fontScale && prefs.fontScale !== 'base') root.setAttribute('data-font-scale', prefs.fontScale);
            if (prefs.reducedMotion) root.setAttribute('data-reduced-motion', 'true');
          }
          var lang = localStorage.getItem('ophtra.lang');
          if (lang === 'ru' || lang === 'kk' || lang === 'en') root.lang = lang;
        } catch (error) {
          /* storage unavailable — defaults apply */
        }
      })();
    </script>
