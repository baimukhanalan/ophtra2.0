<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LUMEN · Офтальмологический центр доктора Кулмаганбетова</title>
    <meta name="description" content="Концепт дизайна LUMEN — история света, который становится зрением. Офтальмологический центр доктора Кулмаганбетова, Астана." />
    <meta name="theme-color" content="#f4f2ed" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:title" content="LUMEN — Свет и оптика · Dr Kulmaganbetov" />
    <meta property="og:description" content="Концепт платформы офтальмологического центра: свет проходит через линзы и становится ясным зрением." />
    <meta property="og:image" content="/media/clinic-day.jpg" />
    <style>
      html { background: #f4f2ed; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 40%, #faf8f3 0%, #f4f2ed 55%, #e9e7e1 100%);
        transition: opacity .7s cubic-bezier(.2,.7,.1,1), visibility 0s linear .7s;
        animation: boot-away .6s ease 2.4s forwards;
      }
      .is-ready #boot { opacity: 0; visibility: hidden; }
      @keyframes boot-away { to { opacity: 0; visibility: hidden; } }
      #boot .lens {
        position: relative; width: min(46vw, 220px); aspect-ratio: 1; border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(168,139,94,.55), inset 0 0 40px rgba(255,255,255,.9), 0 30px 60px -30px rgba(27,46,40,.35);
        background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.2) 45%, rgba(201,176,138,.18) 70%, rgba(27,46,40,.08));
        display: grid; place-items: center; overflow: hidden;
      }
      #boot .lens::before, #boot .lens::after {
        content: ""; position: absolute; inset: -2px; border-radius: 50%;
        border: 1px solid rgba(201,120,110,.35); transform: translate(2px, 1px);
      }
      #boot .lens::after { border-color: rgba(80,140,170,.35); transform: translate(-2px, -1px); }
      #boot .word {
        font: 500 clamp(18px, 4.6vw, 26px)/1 "Unbounded Variable", "Unbounded", system-ui, sans-serif;
        letter-spacing: .5em; color: #1b2e28; padding-left: .5em;
        animation: boot-focus 1.4s cubic-bezier(.2,.7,.1,1) forwards;
      }
      #boot .ring {
        position: absolute; inset: 10%; border-radius: 50%;
        border: 1px dashed rgba(27,46,40,.25);
        animation: boot-turn 1.6s cubic-bezier(.2,.7,.1,1) forwards;
      }
      #boot small {
        position: absolute; bottom: 12%; left: 0; right: 0; text-align: center;
        font: 400 11px/1.4 "Inter Tight Variable", system-ui, sans-serif; letter-spacing: .24em;
        text-transform: uppercase; color: #5d5a4f;
      }
      @keyframes boot-focus { from { filter: blur(10px); letter-spacing: 1.1em; opacity: .2 } to { filter: blur(0); letter-spacing: .5em; opacity: 1 } }
      @keyframes boot-turn { from { transform: rotate(-120deg) scale(1.2); opacity: 0 } to { transform: rotate(0) scale(1); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot .word, #boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="lens"><span class="ring"></span><span class="word">LUMEN</span></div>
      <small>Офтальмологический центр · Астана</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
